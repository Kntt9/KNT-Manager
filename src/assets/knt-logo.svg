<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0080ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052cc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square with gradient -->
  <rect width="200" height="200" rx="48" fill="url(#bgGrad)"/>
  
  <!-- Person silhouette (clean white) -->
  <g filter="url(#shadow)">
    <circle cx="70" cy="115" r="18" fill="#ffffff"/>
    <path d="M 70 135 Q 52 140, 48 158 L 48 178 Q 48 182, 52 182 L 88 182 Q 92 182, 92 178 L 92 158 Q 88 140, 70 135 Z" fill="#ffffff"/>
  </g>
  
  <!-- Roblox square (tilted, clean) -->
  <g transform="translate(125, 100) rotate(20)" filter="url(#shadow)">
    <rect x="-38" y="-38" width="76" height="76" rx="16" fill="#ffffff"/>
    <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#1a1a1a"/>
  </g>
  
  <!-- Blue accent triangle (bottom left) -->
  <path d="M 80 172 L 98 152 L 80 152 Z" fill="#0052cc" opacity="0.6"/>
</svg>
