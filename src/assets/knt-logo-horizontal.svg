<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <defs>
    <linearGradient id="bgGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0080ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052cc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowH">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon container with gradient background -->
  <rect width="70" height="70" rx="18" fill="url(#bgGradH)"/>
  
  <!-- Person silhouette (clean white) -->
  <g filter="url(#shadowH)">
    <circle cx="27" cy="37" r="8" fill="#ffffff"/>
    <path d="M 27 46 Q 19 49, 17 57 L 17 63 Q 17 64.5, 18.5 64.5 L 35.5 64.5 Q 37 64.5, 37 63 L 37 57 Q 35 49, 27 46 Z" fill="#ffffff"/>
  </g>
  
  <!-- Roblox square (tilted, clean) -->
  <g transform="translate(50, 35) rotate(18)" filter="url(#shadowH)">
    <rect x="-15" y="-15" width="30" height="30" rx="6" fill="#ffffff"/>
    <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#1a1a1a"/>
  </g>
  
  <!-- Blue accent triangle -->
  <path d="M 32 60 L 40 51 L 32 51 Z" fill="#0052cc" opacity="0.5"/>
  
  <!-- Text: KNT -->
  <text x="88" y="42" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">KNT</text>
  
  <!-- Text: MANAGER -->
  <text x="88" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#0066ff" letter-spacing="2.5" opacity="0.85">MANAGER</text>
</svg>
